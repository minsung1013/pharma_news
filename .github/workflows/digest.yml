name: BioPharma Digest

on:
  schedule:
    - cron: '0 21 * * *'  # UTC 21:00 = KST 06:00
  workflow_dispatch:       # 수동 실행 버튼

permissions:
  contents: write          # data/ commit-back에 필요

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TZ: Asia/Seoul
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      # ── Gmail (Secrets에서 관리) ────────────
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      RECIPIENTS: ${{ secrets.RECIPIENTS }}

      # ── 큐레이션 튜닝 (여기서 직접 수정) ────
      SCORE_THRESHOLD: 3
      TOP_HIGHLIGHTS: 6
      SCRAPE_TIMEOUT_SEC: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install ffmpeg (TTS mp3 concat)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run digest
        run: python main.py

      - name: Generate narration audio (edge-tts)
        continue-on-error: true      # TTS 실패가 디제스트를 막지 않도록
        run: python -m tts.make_audio

      - name: Publish audio to GitHub Release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUDIO_RELEASE_TAG: audio
        run: bash tts/publish_release.sh

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && echo "No data changes" || \
            git commit -m "data: $(date +%Y-%m-%d) digest" && git push
