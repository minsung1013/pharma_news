name: BioPharma Digest

on:
  schedule:
    - cron: '0 23 * * *'  # UTC 23:00 = KST 08:00
  workflow_dispatch:       # 수동 실행 버튼

permissions:
  contents: write          # data/ commit-back에 필요

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TZ: Asia/Seoul

      # ── LLM ────────────────────────────────
      LLM_PROVIDER: openai
      OPENAI_MODEL: gpt-4o-mini
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      # ── Gmail (Secrets에서 관리) ────────────
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      RECIPIENTS: ${{ secrets.RECIPIENTS }}

      # ── 운영 옵션 (여기서 직접 수정) ────────
      MAX_NEWS_PER_SOURCE: 10
      MAX_PAPERS_PER_SOURCE: 5
      SCRAPE_TIMEOUT_SEC: 30
      ORG_CSV_PATH: ./data/organizations.csv

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright (Chromium)
        run: playwright install --with-deps chromium

      - name: Run digest
        run: python main.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && echo "No data changes" || \
            git commit -m "data: $(date +%Y-%m-%d) digest" && git push
